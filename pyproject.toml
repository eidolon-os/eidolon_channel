[project]
name = "eidolon-channel"
version = "0.1.0"
description = "Eidolon LiveKit voice channel — agent worker, STT/TTS/VAD/EOT plugins"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Eidolon Team", email = "team@eidolon.ai" }]
keywords = ["ai", "voice", "agent", "livekit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "livekit-api>=0.5",
    "livekit-agents>=1.5",
    "livekit-plugins-openai>=0.4",
    "grpcio>=1.68",
    "aiohttp>=3.9",
    "numpy>=1.26",
    "onnxruntime>=1.19",
    "transformers>=4.40",
    "websockets>=12.0",
    "python-socks>=2.4",
    "python-dotenv>=1.0",
    "eidolon-sdk",
    "eidolon-data",
    "modelscope>=1.37.1",
    "addict>=2.4",
    "datasets>=4.0",
    "simplejson>=3.19",
    "sortedcontainers>=2.4",
    "soundfile>=0.12",
    "torch>=2.2",
    "torchaudio>=2.2",
    "scikit-learn>=1.3.2",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.68",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eidolon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["eidolon/livekit/tests"]
markers = ["integration: tests requiring external services or long runs"]
addopts = "-m 'not integration'"

[tool.uv]
find-links = ["https://modelscope.oss-cn-beijing.aliyuncs.com/releases/repo.html"]

# Apple Silicon must remain a supported install target. Without this, uv's universal resolver
# can pick package versions that ship only Linux/Windows wheels (e.g. onnxruntime 1.26.0
# dropped darwin x86_64 entirely, which causes uv to drop darwin from the supported matrix).
# Intel Macs are intentionally not listed — onnxruntime no longer ships darwin x86_64 wheels.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
eidolon-sdk = { path = "../eidolon_sdk", editable = true }
eidolon-data = { path = "../eidolon_data", editable = true }
