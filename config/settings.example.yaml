# Channel settings — copy to config/settings.yaml
# Secret placeholders = env var names; provider plugin keys stay in config/.env only

core:
  livekit_url: ws://127.0.0.1:7880
  api_key: LIVEKIT_API_KEY
  api_secret: LIVEKIT_API_SECRET
  host: 0.0.0.0
  port: 8766

behavior:
  agent_mode: streaming
  audio_sample_rate: 16000

llm:
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  api_key: OPENAI_LLM_API_KEY

providers:
  stt_provider: sensetime
  tts_provider: sensetime
  vad_provider: firered
  brain_provider: direct_llm

remote_agent_rpc:
  target: ""
  locale: zh
  device_token: REMOTE_AGENT_RPC_DEVICE_TOKEN
  conversation_id_prefix: livekit

turn_policy:
  profile: balanced_semantic
  vad:
    activation_threshold: 0.50
    prefix_padding_ms: 300
    min_speech_duration_ms: 100
    min_silence_duration_ms: 500
  eot:
    eot_unlikely_threshold: 0.50
    tail_hang_silence_ms: 2000
  interrupt:
    decision_timeout_ms: 500
    min_interim_chars: 2
    early_cancel_score_threshold: 0.70
    early_resume_score_threshold: 0.20
    hard_stop_lexicon: ["停", "停一下", "别说了", "不要说了", "打住", "闭嘴", "先别讲了"]
    topic_switch_lexicon: ["换个话题", "不聊这个", "别聊这个", "说点别的", "聊点别的", "我们聊点", "刚才那个不用了"]
    correction_lexicon: ["不是", "等一下", "我不是这个意思", "我刚才", "我刚才说", "我刚才说错了"]
  ducking:
    enabled: true
    fade_out_ms: 30
    fade_in_ms: 30
    suspend_volume: 0.0
    buffer_max_ms: 2000
    cooldown_ms: 800
  idle:
    followup_timeout_ms: 15000
  preemptive:
    # Speculative brain generation: start the brain on a stable interim
    # transcript before commit, hiding the STT-final wait. The framework
    # reuses it if the final transcript matches, else cancels via gRPC
    # CancelTurn. preemptive_tts=false keeps audio output gated by commit.
    enabled: true
    preemptive_tts: false

observability:
  structured_logs: true
  metrics_enabled: true
  timeline_debug_path: ""

# Bailian STT/TTS provider config (non-secret). API keys live in .env only:
#   BAILIAN_STT_API_KEY=...   (or DASHSCOPE_API_KEY)
#   BAILIAN_TTS_API_KEY=...
bailian_stt:
  api_url: wss://dashscope.aliyuncs.com/api-ws/v1/inference
  model: fun-asr-realtime-2026-02-28
  sample_rate: 16000
  language: zh
  itn: true
  # Endpointing: silence (ms) before FINAL. 400 (vs provider default 800) cuts
  # first-audio latency; validated not to worsen mid-utterance splits.
  max_sentence_silence_ms: 400
  gate_enabled: false

bailian_tts:
  api_url: wss://dashscope.aliyuncs.com/api-ws/v1/inference
  model: cosyvoice-v3-flash
  voice: longanyang
  sample_rate: 16000
  # first-audio TTFB tuning: flush first segment on early prefix+punctuation
  aggregator_first_sentence_soft_min_chars: 4
  aggregator_first_sentence_flush_any_punct: true
