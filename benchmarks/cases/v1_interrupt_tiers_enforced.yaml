suite_id: v1_interrupt_tiers_enforced
cases:
  - case_id: tier0_hard_stop_enforced_cancels_001
    suite: v1_interrupt_tiers
    description: Tier 0：播放态中明确硬停应最快取消，不等待 EOT 稳定窗口。
    tags: ["v1_interrupt_tiers", "tier0", "hard_stop", "enforced"]
    audio_clips:
      - id: hard_stop_dont
        text: 别说了。
        path: benchmarks/audio/generated/hard_stop_dont.wav
        intent: hard_stop
    user_steps:
      - text: 别说了
        audio: hard_stop_dont
        start_ms: 240
        duration_ms: 520
        interims: ["别说了"]
        final_delay_ms: 80
        vad_probability: 0.95
        agent_speaking: true
        client_playback_state: agent_speaking
    expect:
      action: cancel
      intent: hard_stop
      max_interrupt_decision_ms: 500
      min_user_finals: 1

  - case_id: tier1_topic_switch_enforced_cancels_after_stability_001
    suite: v1_interrupt_tiers
    description: Tier 1/2：无非 Tier0 热词后，换话题文本依靠 EOT/final 语义证据取消；不再由词表产出 topic_switch hint。
    tags: ["v1_interrupt_tiers", "tier2", "topic_switch_text", "enforced", "no_nontier0_lexicon"]
    audio_clips:
      - id: topic_switch
        text: 换个话题，我们聊点别的。
        path: benchmarks/audio/generated/topic_switch.wav
        intent: topic_switch
    user_steps:
      - text: 换个话题
        audio: topic_switch
        start_ms: 240
        duration_ms: 900
        interims: ["换个话题", "换个话题", "换个话题"]
        eot_scores: [0.0, 0.0, 0.72]
        final_delay_ms: 80
        vad_probability: 0.95
        agent_speaking: true
        client_playback_state: agent_speaking
    expect:
      action: cancel
      intent: normal_interrupt
      max_interrupt_decision_ms: 500
      min_user_finals: 1

