      decision_intent: normal_interrupt
      max_interrupt_decision_ms: 800
      no_full_assistant_context_commit: true

  - case_id: opr_fullduplex_echo_then_followup_cancels_001
    suite: offline_policy_regression
    description: 回声样 transcript 先 hold，不应污染上下文；随后真实追问要能继续推进到 cancel。
    timeout_sec: 30
