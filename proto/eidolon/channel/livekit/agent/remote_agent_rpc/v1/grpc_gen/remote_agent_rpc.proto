syntax = "proto3";

// Python codegen: grpc_tools mirrors this path under --python_out as
// eidolon/channel/livekit/agent/remote_agent_rpc/v1/grpc_gen/*.py
package eidolon.channel.livekit.agent.remote_agent_rpc.v1.grpc_gen;

// Channel worker (client) <-> remote emotional / companion agent (server).
// protocol_version must match the major API revision (v1 directory).

// ---------------------------------------------------------------------------
// Envelope (attach to every client/server message)
// ---------------------------------------------------------------------------

message Envelope {
  uint32 protocol_version = 1;
  string session_id = 2;
  uint64 turn_id = 3;
  string trace_id = 4;
}

// ---------------------------------------------------------------------------
// Client -> server
// ---------------------------------------------------------------------------

message ClientMessage {
  Envelope envelope = 1;
  oneof payload {
    ClientConfig config = 10;
    UserTurn user_turn = 11;
    CancelTurn cancel_turn = 12;
    ClientPing ping = 13;
  }
}

message ClientConfig {
  string locale = 1;
}

message UserTurn {
  string user_text = 1;
  bool is_final = 2;
}

message CancelTurn {
  uint64 turn_id = 1;
}

message ClientPing {}

// ---------------------------------------------------------------------------
// Server -> client
// ---------------------------------------------------------------------------

message ServerMessage {
  Envelope envelope = 1;
  oneof payload {
    AssistantDelta assistant_delta = 10;
    AssistantFinal assistant_final = 11;
    ServerError error = 12;
    ServerPing pong = 13;
  }
}

message AssistantDelta {
  string text = 1;
}

message AssistantFinal {
  string full_text = 1;
}

message ServerError {
  string code = 1;
  string message = 2;
  bool fatal = 3;
}

message ServerPing {}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service RemoteAgent {
  // One long-lived logical session per voice room / job. Client may open a
  // new RPC per utterance (simple) or reuse one stream (advanced); v1 keeps
  // semantics minimal: server MUST handle Config + UserTurn per RPC.
  rpc Session(stream ClientMessage) returns (stream ServerMessage);
}
