        audio: owner_followup_capability
        start_ms: 1500
        duration_ms: 1250
        interims: ["那你", "那你现在能帮我做什么"]
        eot_scores: [0.0, 0.74]
        vad_probability: 0.95
        agent_speaking: true
        client_playback_state: agent_speaking
    expect:
      action: cancel
