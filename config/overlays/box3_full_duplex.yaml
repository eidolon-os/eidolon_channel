# Explicit local validation overlay for ESP32 box-3 full-duplex barge-in.
#
# Usage:
#   EIDOLON_CHANNEL_SETTINGS_OVERLAY_YAML=config/overlays/box3_full_duplex.yaml
#
# This is intentionally an overlay, not a product default: it enables the
# channel-owned soft-duck path while keeping production rollout explicit.
providers:
  brain_provider: direct_llm

turn_policy:
  attention:
    enforce: true
    require_direct_signal_during_playback: true
    soft_duck_on_playback_speech_start: true

voiceprint:
  enabled: false

observability:
  timeline_debug_path: "benchmarks/runs/channel-worker-turn-timeline.jsonl"
