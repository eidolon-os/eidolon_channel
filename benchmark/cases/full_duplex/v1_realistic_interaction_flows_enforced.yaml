suite_id: v1_realistic_interaction_flows_enforced
suite_mode: full_duplex
cases:
  - case_id: flow_normal_question_then_agent_reply_001
    suite: v1_realistic_flows
    description: 真实起手：用户在 agent idle 时正常提问，应该进入正常回答链路，不触发打断。
    timeout_sec: 60
    tags: ["v1_realistic_flows", "normal_turn", "agent_idle"]
    audio_clips:
      - id: ask_intro
        text: 帮我详细介绍一下这个方案。
        path: benchmark/audio/generated/normal_ask_intro.wav
        intent: normal
    user_steps:
      - text: 帮我详细介绍一下这个方案
        audio: ask_intro
        start_ms: 80
        duration_ms: 1100
        final_delay_ms: 120
        agent_speaking: false
        client_playback_state: idle
    agent_replies:
      - when: 帮我详细介绍
        reply: 好的，我会先概括整体方案，再说明关键风险和下一步建议。
    expect:
      action: none
      intent: uncertain
      min_user_finals: 1
      min_agent_messages: 1

  - case_id: flow_normal_question_then_hard_stop_001
    suite: v1_realistic_flows
    description: 真实打断：用户先正常提问，agent 回答中用户明确说停一下，应取消当前回答。
    timeout_sec: 60
    tags: ["v1_realistic_flows", "tier0", "hard_stop", "multi_step"]
    audio_clips:
      - id: ask_intro
        text: 帮我详细介绍一下这个方案。
        path: benchmark/audio/generated/normal_ask_intro.wav
        intent: normal
      - id: hard_stop_stop
        text: 停一下。
        path: benchmark/audio/generated/hard_stop_stop.wav
        intent: hard_stop
    user_steps:
      - text: 帮我详细介绍一下这个方案
        audio: ask_intro
        start_ms: 80
        duration_ms: 1100
        final_delay_ms: 120
        agent_speaking: false
        client_playback_state: idle
      - text: 停一下
        audio: hard_stop_stop
        start_ms: 1600
        duration_ms: 520
        interims: ["停一下"]
        final_delay_ms: 80
        agent_speaking: true
        client_playback_state: agent_speaking
    agent_replies:
      - when: 详细介绍
        reply: 好的，我会详细展开。第一点是实时控制，第二点是语义状态，第三点是观测指标，这段回答故意较长，用来制造可打断窗口。
    expect:
      action: cancel
      intent: hard_stop
      max_interrupt_decision_ms: 500
      min_user_finals: 2
      min_agent_messages: 1

  - case_id: flow_normal_question_then_hard_stop_delayed_phrase_001
    suite: v1_realistic_flows
    description: 真实硬停成型延迟：STT 先吐出短噪声/半句话，随后才形成“不要说了”，应按 Tier0 取消；livekit_room 用来暴露 STT 成型慢。
    timeout_sec: 60
    tags: ["v1_realistic_flows", "tier0", "hard_stop", "asr_partial", "multi_step"]
    audio_clips:
      - id: ask_intro
        text: 帮我详细介绍一下这个方案。
        path: benchmark/audio/generated/normal_ask_intro.wav
        intent: normal
      - id: hard_stop_ok_dont
        text: 行，不要说了。
        path: benchmark/audio/generated/hard_stop_ok_dont.wav
        intent: hard_stop
    user_steps:
      - text: 帮我详细介绍一下这个方案
        audio: ask_intro
        start_ms: 80
        duration_ms: 1100
        final_delay_ms: 120
        agent_speaking: false
        client_playback_state: idle
      - text: 行，不要说了
        audio: hard_stop_ok_dont
        start_ms: 1600
        duration_ms: 900
        interims: ["要", "行", "行，不要说了"]
        final_delay_ms: 100
        agent_speaking: true
        client_playback_state: agent_speaking
    agent_replies:
      - when: 详细介绍
        reply: 我会继续较长时间说明方案边界、延迟、稳定性和测试方法，用来验证硬停短句成型慢时是否仍能及时停止。
    expect:
      action: cancel
      intent: hard_stop
      max_interrupt_decision_ms: 900
      min_user_finals: 2
      min_agent_messages: 1

