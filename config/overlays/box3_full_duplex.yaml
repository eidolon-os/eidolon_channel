# Local validation overlay for ESP32 box-3 full-duplex direct-LLM checks.
#
# Usage:
#   EIDOLON_CHANNEL_SETTINGS_OVERLAY_YAML=config/overlays/box3_full_duplex.yaml
#
# Production full-duplex interruption semantics live in config/settings.yaml.
# This overlay only narrows dependencies for local hardware validation.
providers:
  brain_provider: direct_llm

turn_policy:
  attention:
    enforce: true
    require_direct_signal_during_playback: true
    soft_duck_on_playback_speech_start: true

voiceprint:
  enabled: false

observability:
  timeline_debug_path: "benchmark/runs/channel-worker-turn-timeline.jsonl"
