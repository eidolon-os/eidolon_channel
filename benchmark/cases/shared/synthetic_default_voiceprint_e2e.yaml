    intent: hard_stop
    voiceprint: allowed
    brain: any
    agent_audio_response: first
    max_interrupt_decision_ms: 700
    min_user_finals: 1
    min_agent_messages: 1
- case_id: synthetic_default_topic_switch_001
  suite: synthetic_default_voiceprint_e2e
  description: 'default synthetic owner voiceprint: topic switch during agent output
    should cancel and keep the requested new topic.'
  timeout_sec: 90
  tags:
  - synthetic_default
  - voiceprint
  - topic_switch
  audio_clips:
  - id: normal_ask_intro
    text: 帮我详细介绍一下这个方案。
    path: benchmark/audio/synthetic_default/normal_ask_intro.wav
    intent: normal
  - id: topic_switch_pricing
    text: 换个话题，我们聊一下定价。
    path: benchmark/audio/synthetic_default/topic_switch_pricing.wav
    intent: topic_switch
  user_steps:
  - text: 帮我详细介绍一下这个方案
    audio: normal_ask_intro
    start_ms: 200
    duration_ms: 2980
    final_delay_ms: 120
    agent_speaking: false
    client_playback_state: idle
  - text: 换个话题，我们聊一下定价
    audio: topic_switch_pricing
    start_ms: 1800
    duration_ms: 3180
    final_delay_ms: 100
    # Complete clause -> high EOT; cancel comes from EOT/semantic evidence, not
    # first_signal. (Barge-in during playback needs a trustworthy signal — here
    # EOT evidence; on the device it would also carry manual_interrupt.)
    eot_scores: [0.72]
    agent_speaking: true
    client_playback_state: agent_speaking
  expect:
    action: cancel
    voiceprint: allowed
    brain: required
    agent_audio_response: after_user_done
    canonical_contains:
    - 换个话题
    min_user_finals: 1
    min_agent_messages: 1
