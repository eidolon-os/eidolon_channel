  - case_id: tier4_ambient_speech_enforced_observes_001
    suite: v1_interrupt_tiers
    description: Tier 4：播放态中 fresh client state 表明 agent 正在播放，短弱环境声没有足够语义证据时 observe/ignore。
    tags: ["v1_interrupt_tiers", "tier4", "ambient_weak_speech", "enforced"]
    audio_clips:
      - id: normal_followup
        text: 啊。
        path: benchmarks/audio/generated/normal_followup.wav
