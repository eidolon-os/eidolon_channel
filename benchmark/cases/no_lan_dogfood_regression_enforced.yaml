suite_id: no_lan_dogfood_regression_enforced
# No-LAN dogfood regression suite.
#
# These cases model the interaction scripts that previously required a
# Waveshare/ESP32 live dogfood session. They are intentionally policy-level:
# they do not prove audio-device timing, but they make the owner decisions and
# client.audio_state semantics executable without a LAN or physical device.
cases:
  - case_id: nol_waveshare_ptt_idle_tap_no_policy_decision_001
    suite: no_lan_dogfood_regression
    description: 半双工 PTT 空闲轻触：没有 agent playback 时，空按不应被 full-duplex policy 当成打断；真实 half-duplex pipeline 应在 release 后 reject empty_hold。
    timeout_sec: 30
    tags: ["no_lan", "half_duplex", "ptt", "empty_hold", "waveshare_2_06"]
    dogfood:
      enabled: true
      device:
        model: waveshare_esp32_s3_touch_amoled_2_06
        mode: half_duplex
        audio_state_hz: 12
        playback_ack: simulated
    audio_clips:
      - id: ptt_empty_tap
        text: ""
        path: benchmark/audio/generated/backchannel_mm.wav
        intent: manual_interrupt
    user_steps:
      - text: ""
        audio: ptt_empty_tap
        start_ms: 160
        duration_ms: 160
        eot_scores: [0.0]
        vad_probability: 0.1
        agent_speaking: false
        client_playback_state: idle
        client_ptt: true
        client_mic_muted: false
    expect:
      action: none
      decision_action: none
      forbid_actions: ["cancel"]
      min_user_finals: 0

  - case_id: nol_waveshare_ptt_playback_tap_cancels_001
    suite: no_lan_dogfood_regression
    description: 半双工 PTT 播放中轻触：PTT 是显式用户手势，播放态中即使没有 transcript 也必须进入 hard cancel / playback stop 路径。
    timeout_sec: 30
    tags: ["no_lan", "half_duplex", "ptt", "tap_to_stop", "waveshare_2_06"]
    dogfood:
      enabled: true
      device:
        model: waveshare_esp32_s3_touch_amoled_2_06
        mode: half_duplex
        audio_state_hz: 12
        playback_ack: simulated
      agent:
        speaking_text: 我会继续讲系统结构、交互体验、延迟指标和测试边界。
        tts_duration_ms: 6000
    audio_clips:
      - id: ptt_signal
        text: ""
        path: benchmark/audio/generated/backchannel_mm.wav
        intent: manual_interrupt
    user_steps:
      - text: ""
        audio: ptt_signal
        start_ms: 240
        duration_ms: 180
        eot_scores: [0.0]
        vad_probability: 0.9
        agent_speaking: true
        client_playback_state: agent_speaking
        client_ptt: true
        client_mic_muted: false
    expect:
      action: cancel
      decision_action: cancel
      decision_intent: hard_stop
      max_interrupt_decision_ms: 100
      playback_stop_sent: true
      ptt_terminal_action: reject
      ptt_terminal_reason: tap_to_stop

  - case_id: nol_fullduplex_compound_backchannel_holds_001
    suite: no_lan_dogfood_regression
    description: 全双工播放中短反馈“嗯嗯好”：可以短暂 duck/hold，但不能取消 agent、不能当成新用户请求。
    timeout_sec: 30
    tags: ["no_lan", "full_duplex", "backchannel", "false_interruption"]
    dogfood:
      enabled: true
      device:
        model: esp32_box_3
        mode: full_duplex
        audio_state_hz: 10
        playback_ack: simulated
      acoustics:
        echo:
          enabled: true
          delay_ms: 80
          attenuation_db: -18
    audio_clips:
      - id: compound_backchannel
        text: 嗯嗯好。
        path: benchmark/audio/generated/backchannel_mm.wav
        intent: backchannel
    user_steps:
      - text: 嗯嗯好
        audio: compound_backchannel
        start_ms: 260
        duration_ms: 520
        interims: ["嗯嗯好"]
        eot_scores: [0.0]
        vad_probability: 0.85
        agent_speaking: true
        client_playback_state: agent_speaking
    expect:
      action: any
      decision_action: hold
      forbid_actions: ["cancel"]
      max_speech_start_to_resume_ms: 900
      no_full_assistant_context_commit: true

  - case_id: nol_fullduplex_false_start_holds_001
    suite: no_lan_dogfood_regression
    description: 全双工播放中用户只起了个低证据头“我觉得”：应等待更多证据，不应第一信号取消。
    timeout_sec: 30
    tags: ["no_lan", "full_duplex", "false_start", "evidence_gate"]
    dogfood:
      enabled: true
      device:
        model: esp32_box_3
        mode: full_duplex
        audio_state_hz: 10
        playback_ack: simulated
    audio_clips:
      - id: false_start_wojuede
        text: 我觉得。
        path: benchmark/audio/generated/normal_followup.wav
        intent: normal
    user_steps:
      - text: 我觉得
        audio: false_start_wojuede
        start_ms: 260
        duration_ms: 620
        interims: ["我", "我觉得"]
        eot_scores: [0.0, 0.0]
        vad_probability: 0.9
        agent_speaking: true
        client_playback_state: agent_speaking
    expect:
      action: any
      decision_action: hold
      forbid_actions: ["cancel"]
      no_full_assistant_context_commit: true

  - case_id: nol_fullduplex_echo_like_agent_words_holds_001
    suite: no_lan_dogfood_regression
    description: 全双工播放中出现像 agent 正在说的话的 transcript：低 EOT/低证据时保持 hold，避免把回声污染成用户 turn。
    timeout_sec: 30
    tags: ["no_lan", "full_duplex", "echo_safety", "context_ledger"]
    dogfood:
      enabled: true
      device:
        model: esp32_box_3
        mode: full_duplex
        audio_state_hz: 10
        playback_ack: simulated
      agent:
        speaking_text: 我会先讲系统结构，然后讲交互体验。
        tts_duration_ms: 5000
      acoustics:
        echo:
          enabled: true
          delay_ms: 80
          attenuation_db: -14
    audio_clips:
      - id: echo_like_agent_words
        text: 我会先讲系统结构。
        path: benchmark/audio/generated/normal_followup.wav
        intent: echo
    user_steps:
      - text: 我会先讲系统结构
        audio: echo_like_agent_words
        start_ms: 260
        duration_ms: 900
        interims: ["我会先讲", "我会先讲系统结构"]
        eot_scores: [0.0, 0.0]
        vad_probability: 0.8
        agent_speaking: true
        client_playback_state: agent_speaking
    expect:
      action: any
      decision_action: hold
      forbid_actions: ["cancel"]
      no_full_assistant_context_commit: true

  - case_id: nol_fullduplex_followup_after_low_prefix_cancels_001
    suite: no_lan_dogfood_regression
    description: 全双工播放中真实追问先出现短前缀，证据不足时 hold，完整文本和高 EOT 到达后应 cancel。
    timeout_sec: 30
    tags: ["no_lan", "full_duplex", "normal_interrupt", "evidence_gate"]
    dogfood:
      enabled: true
      device:
        model: esp32_box_3
        mode: full_duplex
        audio_state_hz: 10
        playback_ack: simulated
    audio_clips:
      - id: owner_followup_capability
        text: 那你现在能帮我做什么？
        path: benchmark/audio/generated/owner_followup_capability.wav
        intent: normal
    user_steps:
      - text: 那你现在能帮我做什么
        audio: owner_followup_capability
        start_ms: 260
        duration_ms: 1250
        interims: ["那", "那你", "那你现在能帮我做什么"]
        eot_scores: [0.0, 0.0, 0.74]
        vad_probability: 0.95
        agent_speaking: true
        client_playback_state: agent_speaking
    expect:
      action: cancel
      decision_action: cancel
      decision_intent: normal_interrupt
      max_interrupt_decision_ms: 500
