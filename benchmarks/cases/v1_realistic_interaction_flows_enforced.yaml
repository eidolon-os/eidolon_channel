  - case_id: flow_mic_muted_hard_stop_is_ignored_001
    suite: v1_realistic_flows
    description: 真实静音态：client 表示 mic_muted 时，即使 STT 误收到硬停文本，也应 ignore，不取消。
    timeout_sec: 60
    tags: ["v1_realistic_flows", "client_state", "mic_muted", "enforced"]
    audio_clips:
      - id: ask_intro
        text: 帮我详细介绍一下这个方案。
        path: benchmarks/audio/generated/normal_ask_intro.wav
        intent: normal
      - id: hard_stop_dont
        text: 别说了。
        path: benchmarks/audio/generated/hard_stop_dont.wav
        intent: hard_stop
    user_steps:
      - text: 帮我详细介绍一下这个方案
        audio: ask_intro
        start_ms: 80
        duration_ms: 1100
        final_delay_ms: 120
        agent_speaking: false
        client_playback_state: idle
      - text: 别说了
        audio: hard_stop_dont
        start_ms: 1600
        duration_ms: 520
        interims: ["别说了"]
        final_delay_ms: 80
        agent_speaking: true
        client_playback_state: agent_speaking
        client_mic_muted: true
    agent_replies:
