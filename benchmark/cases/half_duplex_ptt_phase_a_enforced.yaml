suite_id: half_duplex_ptt_phase_a_enforced
# Phase A dogfood gate for Waveshare 2.06 / ESP32 half-duplex PTT.
# This suite is intentionally small and mode-specific: it should be run with
# participant metadata interaction_mode=half_duplex, not mixed into the default
# full-duplex barge-in matrix.
cases:
  - case_id: phase_a_ptt_normal_release_commits_001
    suite: half_duplex_ptt_phase_a
    description: 半双工 PTT：按住说一句正常请求，音频结束后 release edge 应提交 turn 并触发 agent 回复。
    timeout_sec: 60
    tags: ["phase_a", "ptt", "half_duplex", "normal_turn", "waveshare_2_06"]
    dogfood:
      enabled: true
      device:
        model: waveshare_esp32_s3_touch_amoled_2_06
        mode: half_duplex
        audio_state_hz: 12
        playback_ack: simulated
    audio_clips:
      - id: normal_ask_intro
        text: 帮我详细介绍一下这个方案。
        path: benchmark/audio/generated/normal_ask_intro.wav
        intent: normal
    user_steps:
      - text: 帮我详细介绍一下这个方案
        audio: normal_ask_intro
        start_ms: 120
        duration_ms: 1100
        final_delay_ms: 120
        agent_speaking: false
        client_playback_state: idle
        client_ptt: true
        client_mic_muted: false
    expect:
      action: none
      decision_action: none
      min_user_finals: 1
      min_agent_messages: 1
      agent_audio_response: after_user_done
      ptt_terminal_action: commit

  - case_id: phase_a_ptt_tap_to_stop_cancels_001
    suite: half_duplex_ptt_phase_a
    description: 半双工 PTT：agent 播放中按下 PTT 是显式 tap-to-stop，应立即取消播放；release 不应提交空 turn。
    timeout_sec: 45
    tags: ["phase_a", "ptt", "half_duplex", "tap_to_stop", "waveshare_2_06"]
    dogfood:
      enabled: true
      device:
        model: waveshare_esp32_s3_touch_amoled_2_06
        mode: half_duplex
        audio_state_hz: 12
        playback_ack: simulated
      agent:
        speaking_text: 我会先讲系统结构，然后讲交互体验、延迟指标和测试边界。
        tts_duration_ms: 6000
    audio_clips:
      - id: ptt_signal
        text: ""
        path: benchmark/audio/generated/backchannel_mm.wav
        intent: manual_interrupt
    user_steps:
      - text: ""
        audio: ptt_signal
        start_ms: 240
        duration_ms: 200
        eot_scores: [0.0]
        vad_probability: 0.9
        agent_speaking: true
        client_playback_state: agent_speaking
        client_ptt: true
        client_mic_muted: false
    expect:
      action: cancel
      decision_action: cancel
      decision_intent: hard_stop
      agent_audio_response: none
      min_user_finals: 0
      min_agent_messages: 0
      max_speech_start_to_cancel_ms: 500
      max_interrupt_resolution_after_started_ms: 500
      playback_stop_sent: true
      ptt_terminal_action: reject
