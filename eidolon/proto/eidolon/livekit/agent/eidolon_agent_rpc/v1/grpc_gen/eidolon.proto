syntax = "proto3";

package eidolon.agent.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// The EidolonAgent service is the companion runtime that LiveKit voice agents
// and other authenticated clients invoke instead of a raw LLM. Owner
// authentication, device binding, and token issuance live outside this service.
service EidolonAgent {
  // Primary: bidirectional streaming chat. The client sends ChatRequest
  // frames (initial + optional cancels + optional signals); the server emits
  // a stream of TurnEvent frames. Both directions stay open for the duration
  // of a session (multiple turns share the connection).
  rpc Chat(stream ChatRequest) returns (stream TurnEvent);

  // Push realtime signals (emotion, prosody, vision tags) OUT OF BAND — i.e.
  // when no Chat stream is open, or from a producer that isn't driving
  // the turn. Requires session_id to route. Prefer the inline
  // ChatRequest.signal frame whenever a Chat stream is already open for the
  // session: it shares the connection, needs no session_id, and is fused into
  // the very next compile pass. Use this unary RPC only for the out-of-band
  // case; the two paths converge on the same SignalFuser.
  rpc PushSignal(SignalRequest) returns (Ack);

  // Server-stream of proactive utterances the agent decides to initiate.
  // Caller subscribes once and decides on its side whether to barge-in.
  rpc SubscribeProactive(SubscribeRequest) returns (stream ProactiveEvent);
}

// ---------------------------------------------------------------------------
// Turn protocol
// ---------------------------------------------------------------------------

message ChatRequest {
  oneof payload {
    StartTurn start = 1;
    CancelTurn cancel = 2;
    // Inline realtime signal on the open Chat stream — the preferred path
    // while a session is live (see PushSignal for the out-of-band variant).
    PushSignalInline signal = 3;
  }
}

message StartTurn {
  string turn_id = 1;          // uuid7; server dedupes on this
  string conversation_id = 2;
  string text = 3;
  google.protobuf.Struct realtime = 4; // optional pre-fused digest
  // Open key/value bag for turn-specific policy/diagnostic values. Owner and
  // runtime binding come only from the verified runtime token. See
  // eidolon_sdk.biz.chat_stream for the well-known
  // TurnEvent.data string enums (DeltaRole / TerminationCause / TurnDoneStatus).
  google.protobuf.Struct metadata = 5;
  // Correlation id for this turn, minted by the transport client (channel), propagated
  // channel -> agent -> memory so one exchange can be traced across hops.
  // Empty = the server derives one (call metadata x-trace-id, else a uuid).
  string trace_id = 6;
  // Speculative (preemptive) turn: the client started this on a partial ASR
  // transcript to warm the LLM. The server streams a reply but MUST NOT
  // persist or fan out to memory until the turn is confirmed (a subsequent
  // non-speculative StartTurn for the same conversation promotes it; a cancel
  // or a superseding turn discards it with no persistence).
  bool speculative = 7;
  // Existing Agent behavior only distinguishes spoken from typed input. This
  // is an input fact, not another principal or product-entrypoint taxonomy.
  string input_modality = 8; // voice | text
}

// Cancel an in-flight turn. ``played_chars``/``played_ms`` report how much of
// the assistant reply the user actually heard when the barge-in happened
// (character offset into the concatenated answer-role DELTA text, and TTS
// playback milliseconds). The server truncates what it persists to its
// Agent-owned history and the memory fanout at that boundary so the
// model's memory matches the user's real auditory experience. 0 with
// has_played_chars=false means "unknown — keep full text" for backward
// compatibility; an explicit 0 means "nothing was heard".
message CancelTurn {
  string turn_id = 1;
  optional uint32 played_chars = 2;
  optional double played_ms = 3;
}

message PushSignalInline {
  string modality = 1;
  string label = 2;
  double confidence = 3;
  google.protobuf.Struct raw = 4;
  google.protobuf.Timestamp ts = 5;
}

// A single event in a turn's stream. ``data`` is an intentionally open
// Struct: each Kind carries a small, well-known set of keys (documented
// below) so new keys can be added without a schema change. Consumers must
// tolerate unknown keys and missing optional keys.
//
//   STATE        { state: "thinking" | "speaking" | ... }
//   DELTA        { text: string,
//                  role?: "answer" (default) | "tool_preamble" | "slow_tool_hint",
//                  prosody?: object }
//                  - role distinguishes spoken *answer* content from
//                    non-answer status lines (e.g. a tool preamble). Absent
//                    role means "answer". Renderers route most non-answer
//                    roles to UI only; "slow_tool_hint" is a delayed spoken
//                    wait hint. Non-answer roles must not be treated as answer
//                    text.
//   TOOL_CALL    { id: string, name: string, arguments: object }
//   TOOL_RESULT  { name: string, ok: bool, content: any, error?: string }
//   CITATION     { ... }
//   USAGE        { tokens_in: number, tokens_out: number }
//   DONE         { status: "ok" | "cancelled" | "errored" | "handed_off",
//                  termination_cause?: "normal" | "user_stop" | "client_cancel"
//                    | "rpc_cancel" | "guardrail" | "error",
//                  control_intent?: "hard_stop" | "topic_switch" | ... }
//                  - termination_cause distinguishes WHY the turn ended.
//                    "user_stop" means the agent classified the utterance
//                    itself as a stop command (no LLM was invoked; upstream
//                    should circuit-break TTS/rendering for this turn).
//                    "client_cancel" acknowledges a CancelTurn frame;
//                    "rpc_cancel" means the transport went away.
//                  - control_intent carries the agent-side classification of
//                    the user utterance (shared taxonomy:
//                    eidolon_sdk.biz.dialogue_control.InterruptIntent) so the
//                    channel can reconcile its fast-path Tier0 decision.
//   ERROR        { code: string, message: string, fatal?: bool }
//   ACK          { cancelled_turn_id: string, already_done: bool }
//                  - emitted in response to a CancelTurn frame so the client
//                    can distinguish "cancel landed" from "turn had already
//                    finished" without waiting for DONE.
//   HANDOFF      { task_id: string, progress_subject: string }
message TurnEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    STATE = 1;
    DELTA = 2;
    TOOL_CALL = 3;
    TOOL_RESULT = 4;
    CITATION = 5;
    USAGE = 6;
    DONE = 7;
    ERROR = 8;
    ACK = 9;
    PROGRESS = 10;
    HANDOFF = 11;
  }
  string turn_id = 1;
  uint64 seq = 2;
  Kind kind = 3;
  google.protobuf.Struct data = 4;
  double ts = 5;
}

// ---------------------------------------------------------------------------
// Signals
// ---------------------------------------------------------------------------

message SignalRequest {
  reserved 1;
  reserved "session_id";
  // The target session comes exclusively from the authenticated runtime token.
  PushSignalInline signal = 2;
}

message Ack { bool accepted = 1; string note = 2; }

// ---------------------------------------------------------------------------
// Proactive
// ---------------------------------------------------------------------------

// The target Companion comes exclusively from the authenticated runtime token.
message SubscribeRequest {
  reserved 1;
  reserved "instance_id";
}

message ProactiveEvent {
  string instance_id = 1;
  string intent = 2;
  string text = 3;
  string style_hint = 4;
  google.protobuf.Timestamp ts = 5;
}
