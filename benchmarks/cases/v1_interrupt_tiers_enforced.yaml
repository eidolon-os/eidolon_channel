  - case_id: tier2_normal_interrupt_no_client_state_stable_cancel_001
    suite: v1_interrupt_tiers
    description: Tier 2：没有 fresh client state 时保留 legacy duck/decide，普通插话需稳定后取消。
    tags: ["v1_interrupt_tiers", "tier2", "normal_interrupt", "legacy_compat"]
    audio_clips:
      - id: normal_followup
        text: 那它的主要风险是什么？
        path: benchmarks/audio/generated/normal_followup.wav
        intent: normal
    user_steps:
      - text: 那它的主要风险是什么
        audio: normal_followup
        start_ms: 260
        duration_ms: 1050
        interims:
          - 那它的主要风险是什么
          - 那它的主要风险是什么
          - 那它的主要风险是什么
          - 那它的主要风险是什么
          - 那它的主要风险是什么
          - 那它的主要风险是什么
        eot_scores: [0.0, 0.25, 0.25, 0.25, 0.25, 0.74]
        final_delay_ms: 80
        vad_probability: 0.9
        agent_speaking: true
        client_playback_state: none
    expect:
      action: cancel
      intent: uncertain
      max_interrupt_decision_ms: 500
      min_user_finals: 1

  - case_id: tier3_backchannel_no_client_state_rolls_back_001
    suite: v1_interrupt_tiers
    description: Tier 3：无 client state 的短附和走 legacy duck/decide，纯 policy runner 只要求不 cancel；真实 VAD-end 再 rollback。
    tags: ["v1_interrupt_tiers", "tier3", "backchannel", "legacy_compat"]
    audio_clips:
      - id: backchannel_ok
        text: 好。
        path: benchmarks/audio/generated/backchannel_ok.wav
        intent: backchannel
    user_steps:
      - text: 好的
        audio: backchannel_ok
        start_ms: 220
        duration_ms: 520
        interims: ["好的"]
        final_delay_ms: 80
        vad_probability: 0.85
        agent_speaking: true
        client_playback_state: none
    expect:
      action: any
      intent: uncertain
      forbid_actions: ["cancel"]
      min_user_finals: 1

