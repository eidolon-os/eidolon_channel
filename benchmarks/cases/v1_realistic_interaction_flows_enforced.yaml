    audio_clips:
      - id: ask_intro
        text: 帮我详细介绍一下这个方案。
        path: benchmarks/audio/generated/normal_ask_intro.wav
        intent: normal
      - id: normal_followup
        text: 那它的主要风险是什么？
        path: benchmarks/audio/generated/normal_followup.wav
        intent: normal
    user_steps:
      - text: 帮我详细介绍一下这个方案
        audio: ask_intro
        start_ms: 80
        duration_ms: 1100
        final_delay_ms: 120
        agent_speaking: false
        client_playback_state: idle
      - text: 那它的主要风险是什么
        audio: normal_followup
        start_ms: 1800
        duration_ms: 1050
        interims:
          - 那它
          - 那它的主要
          - 那它的主要风险
          - 那它的主要风险是什么
        final_delay_ms: 80
        agent_speaking: true
        client_playback_state: agent_speaking
    agent_replies:
      - when: 详细介绍
