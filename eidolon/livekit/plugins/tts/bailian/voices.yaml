# 百炼 CosyVoice 系统音色 —— 音色目录文件（契约 speech_voice_catalog/v1）
#
# 谁读：只有 Channel。通用加载器校验信封和公共字段；`ext` 由百炼适配器
#   （voice_catalog.py）解析成它自己的类型。契约见
#   docs/跨系统/Companion音色选择设计.md §4.3。
# 来源：官方「CosyVoice音色列表」页（source.url），2026-10-30 抓取。
#   顺序与官方页一致，便于对照增删。
# 收录范围：cosyvoice-v3-flash（当前配置）、cosyvoice-v3-plus。
#   cosyvoice-v2 未收录：没有主机配置它；需要时按同一契约补。
#
# 公共字段怎么从官方信息得来（规则写死，不靠感觉）：
#   display_name / summary  官方「名称」「特质」原文
#   gender      读「特质」：含「女」或「姨」为 female，含「男」「爷」「猴哥」为 male，
#               其余为 unspecified（不参与映射）。不从 voice_id 推断
#   age_band    取官方年龄区间中点：<13 child，<28 youth，<55 adult；「60岁以上」senior
#   languages   官方「语言」逐项转成语言键，顺序照抄（第一项是映射用的主语言）
#   styles      「特质」关键词对照表，见设计文档附录 A
#   rank        官方「适用场景」按陪伴产品的相关度排优先级 ×100，再加该场景内的官方顺序
#   lineage     只在官方明确标出同一说话人的另一版本时填写；缺省等于 voice_id
#
# ext（百炼专有，通用层不读）：
#   scene / age  官方「适用场景」「年龄」原文，留作出处
#   regions      官方「支持地域」：cn-beijing = 华北2（北京），ap-southeast-1 = 新加坡
#   ssml / instruct / word_timestamp  官方「特性支持」

