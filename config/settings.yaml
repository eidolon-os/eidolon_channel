# Channel structured settings — secret placeholders = env var names (see settings.example.yaml)

core:
  livekit_url: ws://127.0.0.1:7880
  api_key: LIVEKIT_API_KEY
  api_secret: LIVEKIT_API_SECRET
  host: 0.0.0.0
  port: 8766

worker:
  # Keep one idle worker process warm in dev so VAD/EOT/voiceprint models load
  # at channel startup instead of on the first room job.
  num_idle_processes: 1

behavior:
  instructions: You are a helpful, friendly voice assistant. Keep responses concise.
  welcome_message: 你好！我是你的 AI 助手，请问有什么可以帮你的？
  audio_sample_rate: 16000

# Digital-human video avatar. Global availability/kill-switch; whether a given
# session shows a video avatar is decided per-connection from participant
# metadata (client sends avatar=1 → hub stamps → resolve_avatar_requested).
avatar:
  enabled: true
  # Ditto is HTTPS-only (self-signed) on 61320 — http:// fails; the client skips
  # cert verification for this server-to-server call.
  service_url: https://111.2.199.31:61320
  width: 448
  height: 448
  fps: 25.0
  fallback_to_audio_on_failure: true

llm:
  base_url: https://api.deepseek.com
  model: deepseek-v4-flash
  api_key: OPENAI_LLM_API_KEY
  temperature: 0.7
  timeout: 120

providers:
  stt_provider: bailian
  tts_provider: bailian
  vad_provider: firered_pvad
  brain_provider: eidolon_agent  # [direct_llm", "eidolon_agent"]

remote_agent_rpc:
  target: 127.0.0.1:45051
  locale: zh
  # Phase 32.D 删了 device_token 字段。Token 现在由 runtime_admin 块
  # 描述的 per-session 流程签发。如果你 fork 了 .yaml 还带这一行,
  # loader 会记录 deprecated warning 后忽略它(不是错误,只是死字段)。
  conversation_id_prefix: livekit

# Per-session runtime token signing. participant 进 LiveKit 后，channel 优先
# 从 Eidolon Data 本地解析 (tenant, user, companion/template)，再用
# jwt_secret 现签 device JWT 接 agent gRPC；admin HTTP 只作为跨进程 fallback。
# secret 跟 eidolon-agent 共享 — placeholder PAIRING_JWT_SECRET 是 env 名；
# 空时会 fallback 到 ~/eidolon/run/jwt-secret 文件 (agent auto-persist)。
runtime_admin:
  enabled: true
  data_resolve_enabled: true
  admin_fallback_enabled: true
  admin_api_url: http://127.0.0.1:9000
  jwt_secret: PAIRING_JWT_SECRET
  jwt_algorithm: HS256
  device_token_ttl_seconds: 86400
  http_timeout_sec: 10.0
  http_connect_timeout_sec: 3.0

voiceprint:
  # 正常设备链路要求 Hub approved + Admin claimed + bound companion。
  # Channel 会在 eidolon_agent 路径解析 runtime context；未绑定设备不会进入
  # voice room，因此 voiceprint 只负责已绑定会话内的说话人校验/遥测策略。
  enabled: false
  provider: 3d_speaker
  model: campplus_zh_16k_common
  root: ~/eidolon/voiceprints
  # Empty means use the bundled model in
  # eidolon/livekit/plugins/speaker_verification/resources/3dspeaker.
  model_dir: ""
  threshold: 0.31
  min_audio_ms: 1500
  prewarm: true
  # Paired ESP32 devices are already approved and user-bound in admin.
  # Keep voiceprint as telemetry, but don't hard-block those device turns by default.
  trust_paired_devices: true
  turn_max_audio_ms: 12000
  accept_cache_ttl_ms: 180000
  accept_cache_short_audio_max_ms: 3000
  owner_commit_threshold: 0.58
  owner_short_audio_bypass_ms: 1500

turn_policy:
  # Options: balanced_semantic, fast_e2e_like, patient_companion, custom.
  profile: balanced_semantic
  # channel = Eidolon owns duck/cancel/resume/context ledger.
  # livekit_native_adaptive = LiveKit AgentActivity + AdaptiveInterruptionDetector
  # owns interruption; use only for controlled real-room A/B.
  interruption_owner: channel
  vad:
    activation_threshold: 0.50
    prefix_padding_ms: 300
    min_speech_duration_ms: 100
    min_silence_duration_ms: 500
  eot:
    eot_unlikely_threshold: 0.50
    tail_hang_silence_ms: 2000
    transcript_revision_min_normalized_chars: 4
  interrupt:
    decision_timeout_ms: 450
    post_speech_evidence_timeout_ms: 6000
    post_speech_evidence_min_speech_ms: 250
    framework_false_interruption_timeout_ms: 6000
    stt_commit_transcript_timeout_ms: 5000
    aec_warmup_ms: 1000
    min_interim_chars: 2
    early_cancel_score_threshold: 0.70
    early_resume_score_threshold: 0.20
    transcript_evidence_gate_enabled: true
    min_normal_interim_cjk_chars: 3
    latin_artifact_hold_max_chars: 4
    correction_topic_stability_window_ms: 0
    normal_interrupt_stability_window_ms: 350
    cancel_residual_commit_suppress_ms: 2000
    hard_stop_prefix_min_cjk_chars: 2
    redirect_prefix_min_cjk_chars: 3
    repeated_noise_min_chars: 2
    repeated_noise_max_chars: 6
    weak_signal_followup_hold_ms: 1500
    fast_lexical_intents: true
  ptt:
    # Half-duplex always uses the segment PTT owner: press/release captures one
    # complete audio segment, then STT runs once on that closed segment.
    # "streaming" here means one-shot recognition through the warmed streaming
    # STT connection, not the retired StreamingPipeline PTT owner.
    segment_stt_strategy: streaming
    segment_min_audio_ms: 80
    segment_max_audio_ms: 20000
    segment_min_rms_ppm: 0
    segment_tap_to_stop_max_audio_ms: 900
  ducking:
    enabled: true
    fade_out_ms: 30
    fade_in_ms: 30
    suspend_volume: 0.0
    suspended_passthrough_enabled: false
    suspended_passthrough_volume: 0.25
    buffer_max_ms: 2000
    cooldown_ms: 800
  filler:
    enabled: false
    phrases:
      - 嗯...
      - 好的...
      - 让我想想...
    fade_in_ms: 30
    fade_out_ms: 80
    silence_lead_in_ms: 120
  idle:
    followup_timeout_ms: 15000
    # Disconnect a session idle (no recognized speech / no agent activity)
    # for this long, so a forgotten-open client stops streaming STT. 0 disables.
    disconnect_after_idle_ms: 60000
    # Proactive sessions are reclaimed faster when nobody answers.
    proactive_disconnect_after_idle_ms: 12000
    # Delay room deletion briefly after session_end so the client receives it.
    disconnect_grace_ms: 300
  preemptive:
    # Default off — A/B showed no first-audio gain with eos=400 (see docs).
    enabled: false
    preemptive_tts: false
  attention:
    # Channel owns full-duplex interruption orchestration: playback speech-start
    # may soft-duck immediately, while cancel/commit stays evidence-gated.
    enabled: true
    enforce: true
    client_state_max_age_ms: 2000
    require_direct_signal_during_playback: true
    soft_duck_on_playback_speech_start: true
    ignore_when_mic_muted: true
    echo_min_normalized_chars: 2
    assistant_speech_recent_max_age_ms: 3000

observability:
  structured_logs: true
  metrics_enabled: true
  timeline_debug_path: "~/eidolon/logs/channel/turn-timeline.jsonl"
  llm_first_delta_timeout_ms: 3000
  stt_pending_provider_event_window_ms: 2000
  stt_pending_provider_event_preroll_ms: 500
  stt_pending_provider_event_max_count: 32

# Bailian STT/TTS provider config (non-secret). API keys stay in .env
# (BAILIAN_STT_API_KEY / BAILIAN_TTS_API_KEY).
bailian_stt:
  api_url: wss://dashscope.aliyuncs.com/api-ws/v1/inference
  model: fun-asr-realtime-2026-02-28
  sample_rate: 16000
  language: zh
  itn: true
  # Endpointing: silence (ms) before FINAL. 400 (vs provider default 800) cuts
  # first-audio latency; validated not to worsen mid-utterance splits. 500-600 = safer.
  max_sentence_silence_ms: 400
  gate_enabled: false
  gate_preroll_ms: 500
  gate_tail_window_ms: 1500
  gate_keepalive_interval_sec: 1.0
  gate_keepalive_frame_ms: 100
  gate_vad_high_threshold: 0.6
  gate_vad_low_threshold: 0.3
  gate_rms_threshold: 500.0
  # Diagnostic: dump the exact PCM the recognizer receives (post-resample, 16 kHz
  # mono) to one WAV per stream run under dump_dir — used to tell clean speech from
  # echo/noise on a device's uplink. ON now for stackchan half_duplex debugging;
  # set false in production. (Env EIDOLON_STT_DUMP_WAV / EIDOLON_STT_DUMP_DIR still
  # work as a fallback default.)
  dump_wav: true
  dump_dir: "~/eidolon/debug"

bailian_tts:
  api_url: wss://dashscope.aliyuncs.com/api-ws/v1/inference
  model: cosyvoice-v3-flash
  voice: longanyang
  audio_format: pcm
  sample_rate: 16000
  speech_rate: 1.0
  volume: 50
  pitch: 1.0
  pool_size: 4
  pool_size_bootstrap: 3
  pool_refill_backoff: 1.5
  pool_acquire_timeout: 12.0
  pool_max_idle_sec: 15.0
  ws_heartbeat_sec: 15.0
  task_started_timeout: 15.0
  task_finished_timeout: 20.0
  first_token_timeout: 15.0
  inter_token_timeout: 10.0
  no_first_audio_timeout: 5.0
  aggregator_soft_min_chars: 12
  aggregator_hard_max_chars: 80
  aggregator_idle_ms: 300
  # first-audio TTFB tuning: flush first segment on early prefix+punctuation
  aggregator_first_sentence_soft_min_chars: 4
  aggregator_first_sentence_flush_any_punct: true
  log_audio_diag: true

# SenseTime STT/TTS provider config (non-secret). API keys stay in .env
# (SENSETIME_STT_API_KEY / SENSETIME_TTS_API_KEY).
sensetime_stt:
  api_url: wss://api.senseaudio.cn/ws/v1/audio/transcriptions
  model: senseaudio-asr-deepthink-1.5-260319
  sample_rate: 16000
  language: zh
  max_stream_retries: 3
  min_speech_duration_ms: 300
  silence_duration_ms: 800
  log_audio_diag: true

sensetime_tts:
  api_url: wss://api.senseaudio.cn/ws/v1/t2a_v2
  model: senseaudio-tts-1.5-260319
  voice: female_0033_a
  audio_format: pcm
  sample_rate: 32000
  bitrate: 128000
  channel: 1
  speed: 1.0
  vol: 1.0
  pitch: 0
  pool_size: 4
  first_token_timeout: 15.0
  no_first_audio_timeout: 5.0
  aggregator_soft_min_chars: 12
  aggregator_hard_max_chars: 60
  aggregator_idle_ms: 300
  log_audio_diag: true
