      no_full_assistant_context_commit: true

  - case_id: opr_fullduplex_echo_then_hard_stop_cancels_001
    suite: offline_policy_regression
    description: 回声样 transcript 先 hold 后，后续用户语音在高 EOT 证据下应 cancel，证明 echo hold 不会吞掉后续强证据。
    timeout_sec: 30
    tags: ["offline_policy", "full_duplex", "echo_safety", "hard_stop", "state_continuity"]
    device_envelope:
      enabled: true
      device:
        model: esp32_box_3
        mode: full_duplex
        audio_state_hz: 10
        playback_ack: simulated
      agent:
        speaking_text: 我会先讲系统结构，然后讲交互体验。
        tts_duration_ms: 5000
      acoustics:
