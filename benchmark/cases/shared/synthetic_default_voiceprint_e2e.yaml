    output while preserving the first owner turn.'
  timeout_sec: 90
  tags:
  - synthetic_default
  - voiceprint
  - hard_stop
  audio_clips:
  - id: normal_ask_intro
    text: 帮我详细介绍一下这个方案。
    path: benchmark/audio/synthetic_default/normal_ask_intro.wav
    intent: normal
  - id: hard_stop_stop
    text: 停一下。
    path: benchmark/audio/synthetic_default/hard_stop_stop.wav
    intent: hard_stop
  user_steps:
  - text: 帮我详细介绍一下这个方案
    audio: normal_ask_intro
    start_ms: 200
    duration_ms: 2980
    final_delay_ms: 120
    agent_speaking: false
    client_playback_state: idle
  - text: 停一下
    audio: hard_stop_stop
    start_ms: 1800
    duration_ms: 1780
    interims:
    - 停一下
    final_delay_ms: 80
    agent_speaking: true
    client_playback_state: agent_speaking
